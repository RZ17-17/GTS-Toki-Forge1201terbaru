
name: Setup Java 17 and Gradle 8.5

on:
  workflow_dispatch:

jobs:
  setup:
    name: Install and verify Java and Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
