name: Build Toki Forge 1.20.1 JAR

on:
  push:
    branches:
      - main
      - fix/toki-ranged-attacks-while-stationary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Forge mod
        run: gradle --no-daemon clean build
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gts-toki-forge-1.20.1-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gts-toki-build-diagnostics
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7
